<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Персональна добірка турів — ХО TRAVEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 95px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Top Floating Editor Panel */
    .editor-control-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #111827;
      color: #f3f4f6;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .editor-control-bar select, .editor-control-bar button {
      background: #1f2937;
      color: #f9fafb;
      border: 1px solid #374151;
      padding: 6px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .editor-control-bar select:hover, .editor-control-bar button:hover {
      background: #374151;
    }
    .theme-pill-tag {
      background: #10b981;
      color: #064e3b;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Image zoom on hover */
    .hotel-img-zoom {
      width: 100%;
      height: 115%;
      object-fit: cover;
      object-position: center 60%;
      transform: translateY(-9%) scale(1.12);
      display: block;
      transition: transform 0.4s ease;
    }
    .hotel-img-wrap:hover .hotel-img-zoom {
      transform: translateY(-9%) scale(1.16);
    }

    /* Editor bar */
    .editor-control-bar { flex-wrap: wrap; }
    .editor-control-bar > div { flex-wrap: wrap; }
    .tourist-switch { display:inline-flex; align-items:center; gap:6px; font-weight:700; cursor:pointer; user-select:none; }
    .tourist-switch input { position:absolute; opacity:0; pointer-events:none; }
    .tourist-switch .sw { width:30px; height:17px; border-radius:99px; background:#4b5563; position:relative; transition:background .2s; }
    .tourist-switch .sw::after { content:''; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition:transform .2s; }
    .tourist-switch input:checked + .sw { background:#10b981; }
    .tourist-switch input:checked + .sw::after { transform:translateX(13px); }
    .tourist-switch input:focus-visible + .sw { outline:2px solid #a7f3d0; outline-offset:2px; }

    /* Tourist preview */
    .tourist-exit { display:none; position:fixed; top:10px; right:10px; z-index:1500; background:rgba(17,24,39,.85); color:#fff; border:0; border-radius:99px; padding:7px 14px; font:700 11px inherit; font-family:inherit; cursor:pointer; backdrop-filter:blur(6px); }
    body.tourist-mode .editor-control-bar, body.tourist-clean .editor-control-bar { display:none; }
    body.tourist-mode .tourist-exit { display:block; }

    /* Gallery */
    .g-track { display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; }
    .g-track::-webkit-scrollbar { display:none; }
    .g-slide { flex:0 0 100%; height:100%; overflow:hidden; scroll-snap-align:center; scroll-snap-stop:always; }
    .g-empty { display:flex; align-items:center; justify-content:center; font-size:48px; background:linear-gradient(135deg,#1e293b,#0f172a); }
    .g-badges { position:absolute; top:12px; left:12px; display:flex; gap:6px; pointer-events:none; }
    .g-arrow { position:absolute; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%; border:0; background:rgba(15,23,42,.6); color:#fff; font-size:22px; line-height:1; cursor:pointer; display:none; align-items:center; justify-content:center; padding:0 0 3px; }
    .g-prev { left:10px; } .g-next { right:10px; }
    @media (hover:hover) and (pointer:fine) { .g-arrow { display:flex; opacity:0; transition:opacity .2s; } .hotel-img-wrap:hover .g-arrow, .g-arrow:focus-visible { opacity:1; } }
    .g-arrow:hover { background:rgba(15,23,42,.85); }
    .g-dots { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:5px; pointer-events:none; }
    .g-dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.55); transition:all .2s; }
    .g-dot.on { background:#fff; width:16px; border-radius:99px; }
    .g-count { position:absolute; bottom:8px; right:10px; background:rgba(15,23,42,.7); color:#fff; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; pointer-events:none; }

    /* Options */
    .opt-card { position:relative; padding:14px 10px 12px; border-radius:12px; border:1px solid var(--bd); background:var(--cell); color:var(--txt); cursor:pointer; text-align:center; font-family:inherit; transition:all .15s; }
    .opt-card.sel { border:1.5px solid var(--selbd); background:var(--selbg); box-shadow:0 4px 12px rgba(27,77,62,.1); }
    .opt-price { font-size:14px; font-weight:900; margin-top:6px; color:var(--pr); }
    .best-badge { position:absolute; top:-9px; left:50%; transform:translateX(-50%); white-space:nowrap; background:#ea580c; color:#fff; font-size:10px; font-weight:800; padding:2px 8px; border-radius:99px; }
    .best-badge.sm { font-size:8px; padding:1px 5px; top:-7px; }
    .mx-scroll { overflow-x:auto; border:1px solid var(--bd); border-radius:12px; padding-top:6px; }
    .mx { border-collapse:separate; border-spacing:4px; width:100%; font-size:12px; }
    .mx th { font-weight:800; color:var(--sub); padding:6px 8px; white-space:nowrap; text-align:center; font-size:11px; }
    .mx tbody th { text-align:left; position:sticky; left:0; background:inherit; color:var(--txt); }
    .mx-corner { text-align:left !important; }
    .mx td { padding:0; text-align:center; min-width:84px; }
    .mx-empty { color:var(--sub); opacity:.5; }
    .mx-cell { position:relative; width:100%; padding:11px 6px 9px; border-radius:10px; border:1px solid var(--bd); background:var(--cell); color:var(--pr); font:900 13px inherit; font-family:inherit; cursor:pointer; transition:all .15s; }
    .mx-cell small { font-size:9px; font-weight:700; margin-left:3px; opacity:.8; }
    .mx-cell.sel { border:1.5px solid var(--selbd); background:var(--selbg); }

    /* Footer button, flight badge, flash */
    .choose-btn { border:none; border-radius:12px; padding:10px 16px; font:800 12px inherit; font-family:inherit; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.1); line-height:1.3; text-align:center; }
    .choose-btn small { display:block; font-weight:600; font-size:10px; opacity:.85; margin-top:2px; }
    .flight-badge { display:inline-block; background:rgba(14,116,144,.1); color:#0e7490; border:1px solid rgba(14,116,144,.25); font-size:11px; font-weight:800; padding:3px 10px; border-radius:99px; }
    .flash { animation:flashIn .5s ease; }
    @keyframes flashIn { from { opacity:.2; transform:translateY(4px); } to { opacity:1; transform:none; } }
    .share-btn { width:100%; margin-top:10px; padding:10px; border-radius:12px; border:1.5px dashed currentColor; background:transparent; color:inherit; font:800 12px inherit; font-family:inherit; cursor:pointer; }
    .share-btn.hdr { width:auto; margin-top:12px; color:#fff; border:1px solid rgba(255,255,255,.55); background:rgba(255,255,255,.12); padding:8px 14px; }

    /* Toast */
    .toast { position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 18px; border-radius:99px; font-size:13px; font-weight:700; z-index:3000; box-shadow:0 8px 24px rgba(0,0,0,.3); animation:toastIn .25s ease; max-width:90vw; text-align:center; }
    .toast.hide { opacity:0; transition:opacity .35s; }
    @keyframes toastIn { from { opacity:0; transform:translate(-50%,10px); } }

    /* Builder */
    .b-box { background:#fff; color:#0f172a; border-radius:18px; width:100%; max-width:960px; max-height:92vh; display:flex; flex-direction:column; box-shadow:0 20px 40px rgba(0,0,0,.25); }
    .b-head, .b-foot { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 18px; flex-wrap:wrap; }
    .b-head { border-bottom:1px solid #e2e8f0; } .b-foot { border-top:1px solid #e2e8f0; }
    .b-head h3 { font-size:16px; font-weight:800; color:#133329; }
    .b-x { border:none; background:#f1f5f9; width:28px; height:28px; border-radius:50%; font-weight:700; cursor:pointer; }
    .b-grid { display:grid; grid-template-columns:260px 1fr; overflow:hidden; flex:1; min-height:0; }
    .b-side { border-right:1px solid #e2e8f0; padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; background:#f8fafc; }
    .b-main { padding:14px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
    .b-title { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:#475569; }
    .b-item { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:8px 10px; border:1px solid #e2e8f0; background:#fff; border-radius:10px; cursor:pointer; font-size:12px; font-weight:700; }
    .b-item.on { border-color:#133329; background:#eef7f2; }
    .b-item-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .b-item-ctl { display:flex; gap:2px; flex:none; }
    .b-item-ctl button { border:none; background:#f1f5f9; border-radius:6px; width:24px; height:24px; cursor:pointer; font-size:11px; }
    .b-item-ctl button:disabled { opacity:.3; cursor:default; }
    .b-paste { background:#f0f9f4; border:1px dashed #86b9a0; border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; }
    .b-lab { display:block; font-size:12px; font-weight:700; color:#475569; }
    .b-inp { display:block; width:100%; margin-top:4px; padding:8px 12px; border:1px solid #cbd5e1; border-radius:8px; font:13px inherit; font-family:inherit; color:#0f172a; background:#fff; resize:vertical; }
    .b-row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .b-btn { padding:8px 16px; background:#133329; color:#d9ef9f; border:none; border-radius:8px; font:800 12px inherit; font-family:inherit; cursor:pointer; }
    .b-btn.ghost { background:#f1f5f9; color:#0f172a; }
    .b-muted { font-size:12px; color:#64748b; }
    @media (max-width:700px) { .b-grid { grid-template-columns:1fr; overflow-y:auto; } .b-side { border-right:none; border-bottom:1px solid #e2e8f0; max-height:none; overflow:visible; } .b-main { overflow:visible; } .b-row2 { grid-template-columns:1fr; } }

    /* Verdict badge */
    .verdict { display:inline-block; margin-bottom:8px; padding:5px 10px; border-radius:8px; font-size:12px; font-weight:800; line-height:1.35; color:var(--vc); background:color-mix(in srgb, var(--vc) 10%, transparent); border:1px solid color-mix(in srgb, var(--vc) 28%, transparent); }
    /* Scenario tabs */
    .sc-tabs { display:flex; gap:8px; margin-top:14px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
    .sc-tabs::-webkit-scrollbar { display:none; }
    .sc-tab { flex:1 0 auto; min-width:150px; text-align:left; padding:9px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); color:inherit; font-family:inherit; cursor:pointer; transition:all .15s; }
    .sc-tab b { display:block; font-size:13px; font-weight:800; }
    .sc-tab small { display:block; font-size:11px; opacity:.8; margin-top:2px; }
    .sc-tab.on { background:#fff; color:#1c2420; border-color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.15); }
    /* Confirm card */
    .confirm-card { margin-top:12px; padding:14px; border-radius:14px; border:1px solid; display:flex; flex-direction:column; gap:10px; animation:flashIn .35s ease; }
    .confirm-msg { font-size:12px; font-style:italic; line-height:1.45; opacity:.8; padding:8px 10px; border-radius:10px; background:rgba(255,255,255,.6); color:#1c2420; }
    .confirm-tg { display:block; text-align:center; background:#229ed9; color:#fff; text-decoration:none; padding:12px; border-radius:12px; font-size:13px; font-weight:800; }
    .confirm-card .share-btn { margin-top:0; }

    /* Compare */
    body.no-scroll { overflow:hidden; }
    .cmp-btn { margin:0 0 10px; padding:6px 12px; border-radius:99px; border:1.5px solid #133329; background:transparent; color:#133329; font:800 12px inherit; font-family:inherit; cursor:pointer; transition:all .15s; }
    .cmp-btn.on { background:#133329; color:#d9ef9f; }
    body .cmp-btn { min-height:34px; }
    .cmp-bar { position:fixed; left:12px; right:12px; bottom:84px; max-width:616px; margin:0 auto; z-index:150; background:#133329; color:#fff; border-radius:16px; padding:10px 12px; display:flex; align-items:center; flex-wrap:wrap; gap:8px; box-shadow:0 10px 30px rgba(0,0,0,.3); animation:toastIn .25s ease; }
    .cmp-bar-txt { flex:1 1 100%; font-size:13px; line-height:1.3; } .cmp-bar-txt small { opacity:.7; }
    .cmp-go { flex:1; background:#10b981; color:#052e22; border:0; border-radius:10px; padding:10px 12px; font:800 13px inherit; font-family:inherit; cursor:pointer; }
    .cmp-go:disabled { opacity:.45; cursor:default; }
    .cmp-clear { background:rgba(255,255,255,.12); color:#fff; border:0; border-radius:10px; padding:10px 12px; font:700 12px inherit; font-family:inherit; cursor:pointer; }
    .cmp-modal { position:fixed; inset:0; z-index:2500; background:#f8fafc; color:#0f172a; display:flex; flex-direction:column; animation:flashIn .25s ease; }
    .cmp-top { background:#133329; color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
    .cmp-top b { font-size:16px; display:block; } .cmp-top small { font-size:11px; opacity:.75; }
    .cmp-x { width:40px; height:40px; border-radius:50%; border:0; background:rgba(255,255,255,.15); color:#fff; font-size:16px; cursor:pointer; }
    .cmp-scroll { flex:1; overflow:auto; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; }
    .cmp-grid { display:grid; grid-template-columns:repeat(var(--n), minmax(78vw, 1fr)); gap:1px; background:#e2e8f0; min-width:min-content; }
    @media (min-width:900px) { .cmp-grid { grid-template-columns:repeat(var(--n), minmax(0, 1fr)); max-width:1100px; margin:0 auto; } }
    .cmp-cell { background:#f8fafc; padding:14px; scroll-snap-align:start; }
    .cmp-head { background:#fff; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; z-index:2; }
    .cmp-photo { aspect-ratio:16/10; overflow:hidden; border-radius:10px; background:#0f172a; }
    .cmp-photo img { width:100%; height:115%; object-fit:cover; object-position:center 60%; transform:translateY(-9%) scale(1.12); display:block; }
    .cmp-stars { color:#d97706; font-size:13px; } .cmp-name { font-size:16px; font-weight:800; color:#133329; line-height:1.25; } .cmp-resort { font-size:12px; color:#64748b; }
    .cmp-rm { align-self:flex-start; background:none; border:0; color:#64748b; font:600 11px inherit; font-family:inherit; text-decoration:underline; cursor:pointer; padding:2px 0; }
    .cmp-lab { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:#10b981; margin-bottom:6px; }
    .cmp-val { font-size:14px; line-height:1.5; } .cmp-val.note { background:#fff; border-left:3px solid #10b981; padding:8px 10px; border-radius:8px; font-size:13px; }
    .cmp-na { opacity:.55; font-style:italic; } .cmp-price { font-size:24px; font-weight:900; color:#133329; }
    .cmp-act { position:sticky; bottom:0; background:#fff; border-top:1px solid #e2e8f0; z-index:2; }
    .cmp-choose { width:100%; padding:14px; border:0; border-radius:12px; background:#133329; color:#d9ef9f; font:800 14px inherit; font-family:inherit; cursor:pointer; }
    .cmp-choose:hover { background:#10b981; color:#052e22; }

    /* AI generator */
    .gen-box { background:linear-gradient(135deg,#133329,#1e4a3e); color:#fff; border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px; }
    .gen-box .b-title { color:#a7f3d0; } .gen-box .b-muted { color:rgba(255,255,255,.7); }
    .gen-focus { display:flex; flex-wrap:wrap; gap:6px; }
    .gen-focus button { border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); color:#fff; border-radius:99px; padding:6px 10px; font:700 12px inherit; font-family:inherit; cursor:pointer; }
    .gen-focus button.on { background:#10b981; border-color:#10b981; color:#052e22; }
    .gen-btn { background:#d9ef9f; color:#133329; border:0; border-radius:10px; padding:11px; font:900 13px inherit; font-family:inherit; cursor:pointer; box-shadow:0 4px 14px rgba(217,239,159,.25); }
    .gen-btn:hover { background:#fff; }
    .gen-flash { animation:genFlash 1.2s ease; }
    @keyframes genFlash { 0% { background:#d1fae5; } 100% { background:#fff; } }
  </style>
</head>
<body>
  <!-- Editor control strip for testing/live tuning -->
  <div class="editor-control-bar">
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="theme-pill-tag">ХО MAKET</span>
      <span style="font-weight:700;">Тема макету:</span>
      <select id="themeSelector" onchange="window.switchTheme(this.value)">
        <option value="sand">Теплий пісок (Ivory Sand)</option>
        <option value="glass">Курортний Glassmorphism</option>
        <option value="coastal">Морський бриз (Coastal Azure)</option>
        <option value="dark">Глибокий смарагд (Emerald Velvet)</option>
        <option value="sunset">Сансет & Теракота (Sunset Warm)</option>
      </select>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span id="saveStatus" style="color:#a7f3d0; font-size:11px;">● Готово до правок</span>
      <label class="tourist-switch" title="Сховати панель редактора і побачити сторінку як клієнт">
        <input type="checkbox" id="touristToggle" onchange="window.toggleTouristMode(this.checked)" />
        <span class="sw"></span> 👁️ Очима туриста
      </label>
      <button onclick="window.openBuilder()">➕ Додати / Редагувати готелі</button>
      <button onclick="window.openQuickEditor()">✏️ Швидкі правки шапки</button>
    </div>
  </div>

  <button type="button" class="tourist-exit" onclick="window.toggleTouristMode(false)">← Вийти з режиму туриста (Esc)</button>
  <div id="selectionApp"></div>
  <div id="builderModal" class="modal-backdrop" style="display:none;" onclick="if(event.target === this) window.closeBuilder()"></div>

  <!-- Quick Edit Modal -->
  <div id="quickEditModal" class="modal-backdrop" style="display:none;" onclick="if(event.target === this) window.closeQuickEditor()">
    <div style="background:#fff; color:#0f172a; border-radius:18px; max-width:500px; width:100%; padding:22px; box-shadow:0 20px 40px rgba(0,0,0,0.2);" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid #e2e8f0; padding-bottom:10px;">
        <h3 style="font-size:16px; font-weight:800; color:#133329; margin:0;">✏️ Налаштування шапки підбірки</h3>
        <button style="border:none; background:#f1f5f9; width:28px; height:28px; border-radius:50%; font-weight:bold; cursor:pointer;" onclick="window.closeQuickEditor()">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:12px; font-size:13px;">
        <div>
          <label style="display:block; font-weight:700; margin-bottom:4px; color:#475569;">Ім'я туриста (для заголовка):</label>
          <input id="editName" type="text" style="width:100%; padding:8px 12px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit; font-size:13px;" />
        </div>
        <div>
          <label style="display:block; font-weight:700; margin-bottom:4px; color:#475569;">Курорт / Напрямок:</label>
          <input id="editDest" type="text" style="width:100%; padding:8px 12px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit; font-size:13px;" />
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label style="display:block; font-weight:700; margin-bottom:4px; color:#475569;">Місто вильоту:</label>
            <input id="editDep" type="text" style="width:100%; padding:8px 12px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit; font-size:13px;" />
          </div>
          <div>
            <label style="display:block; font-weight:700; margin-bottom:4px; color:#475569;">Склад туристів:</label>
            <input id="editTourists" type="text" style="width:100%; padding:8px 12px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit; font-size:13px;" />
          </div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label style="display:block; font-weight:700; margin-bottom:4px; color:#475569;">Менеджер:</label>
            <input id="editMgrName" type="text" style="width:100%; padding:8px 12px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit; font-size:13px;" />
          </div>
          <div>
